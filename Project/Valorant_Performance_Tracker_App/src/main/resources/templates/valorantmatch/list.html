
<!DOCTYPE html>

<!--Thanks to Ferhad, Francisco, and Carter from grad 2022 for the styling on this page.-->

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
    <title id="pageTitle" th:text="${session.title}">Topic List</title>
</head>
<body>
<nav th:replace="fragments/navHeader :: navbar"></nav>

<div class="container my-4">

    <h2 class="mb-3 text-center title">Valorant Match List</h2>

    <h2 class="mb-3 text-center error"
        th:if="${not #strings.isEmpty(messageError)}"
        th:text="${messageError}">
        Message from controller
    </h2>

    <h2 class="mb-3 text-center success"
        th:if="${not #strings.isEmpty(messageSuccess)}"
        th:text="${messageSuccess}">
        Message success from controller
    </h2>

    <!-- Search by player name -->
    <form th:object="${match}"
          action="replacedBeforePageRendered"
          th:action="@{/valorantmatch/search}"
          method="post"
          class="mb-4">

        <label for="name" th:text="#{label.search.name}">
            Name
        </label>

        <input type="text" id="name" th:field="${match.playerName}"/>

        <button type="submit" class="btn btn-danger">
            <i class="fas fa-search"></i> Search
        </button>
    </form>

    <!-- Match history table -->
    <div class="table-responsive">

        <table id="theData"
               class="table table-striped table-hover align-middle">

            <thead class="table-dark text-center">
            <tr>
                <th>ID</th>
                <th>Player Name</th>
                <th>Agent</th>
                <th>Map</th>
                <th>Kills</th>
                <th>Deaths</th>
                <th>Assists</th>
                <th>Damage Dealt</th>
                <th>Rounds Played</th>
                <th>KAST Rounds</th>
                <th>KDA Ratio</th>
                <th>ACS</th>
                <th>KAST %</th>
                <th>Options</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="current : ${matches}">

                <td th:text="${current.matchId}"></td>
                <td th:text="${current.playerName}"></td>
                <td th:text="${current.agent}"></td>
                <td th:text="${current.mapName}"></td>
                <td th:text="${current.kills}"></td>
                <td th:text="${current.deaths}"></td>
                <td th:text="${current.assists}"></td>
                <td th:text="${current.damage}"></td>
                <td th:text="${current.rounds}"></td>
                <td th:text="${current.kastRounds}"></td>

                <!-- KDA -->
                <td th:text="${#numbers.formatDecimal(T(ca.hccis.valorant.bo.ValorantMatchBO).calculateKdaRatio(current), 1, 2)}"></td>

                <!-- ACS -->
                <td th:text="${#numbers.formatDecimal(T(ca.hccis.valorant.bo.ValorantMatchBO).calculateAcs(current), 1, 2)}"></td>

                <!-- KAST Percentage -->
                <td th:text="${#numbers.formatDecimal(T(ca.hccis.valorant.bo.ValorantMatchBO).calculateKastPercentage(current), 1, 2)} + '%'"></td>

                <!-- Edit and Delete buttons -->
                <td class="text-center">

                    <div class="btn-group" role="group"
                         style="display:inline-flex; gap:8px;">

                        <!-- Edit -->
                        <a th:href="@{/valorantmatch/edit/{id}(id=${current.matchId})}"
                           class="btn btn-sm btn-outline-primary"
                           title="Edit Match"
                           style="background-color:#2563eb;
                                  color:white;
                                  border:1px solid #2563eb;
                                  border-radius:6px;
                                  padding:8px 12px;
                                  font-weight:600;
                                  text-decoration:none;">

                            <i class="fas fa-edit"></i> Edit
                        </a>

                        <!-- Delete -->
                        <a th:href="@{/valorantmatch/delete/{id}(id=${current.matchId})}"
                           class="btn btn-sm btn-outline-danger"
                           title="Delete Match"
                           style="background-color:#dc3545;
                                  color:white;
                                  border:1px solid #dc3545;
                                  border-radius:6px;
                                  padding:8px 12px;
                                  font-weight:600;
                                  text-decoration:none;">

                            <i class="fas fa-trash"></i> Delete
                        </a>

                    </div>

                </td>

            </tr>

            <!-- Message when no data -->
            <tr th:if="${#lists.isEmpty(matches)}">
                <td colspan="14"
                    class="text-center text-muted py-4">
                    No matches found.
                </td>
            </tr>

            </tbody>
        </table>

    </div>

    <!-- Add New Match -->
    <div class="text-center mt-4">

        <a th:href="@{/valorantmatch/add}"
           href="/valorantmatch/add"
           class="btn btn-success"
           style="background-color:#ff4655;
                  color:white;
                  border:1px solid #ff4655;
                  border-radius:8px;
                  padding:12px 24px;
                  font-weight:700;
                  text-decoration:none;">

            <i class="fas fa-plus"></i> Add New Match

        </a>

    </div>

</div>

<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
