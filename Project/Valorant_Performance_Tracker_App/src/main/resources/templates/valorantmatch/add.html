
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
    <title id="pageTitle" th:text="#{label.add.edit}">Label Add/Edit</title>
</head>
<body>
<nav th:replace="fragments/navHeader :: navbar"></nav>

<div class="container has-text-centered">
    <h2 class="title is-2" th:if="${valorantMatch.matchId != null}" th:text="#{label.edit.match}">label Edit</h2>
    <h2 class="title is-2" th:if="${valorantMatch.matchId == null}" th:text="#{label.add.match}">label Add</h2>

    <form th:action="@{/valorantmatch/submit}"
          th:object="${valorantMatch}"
          method="post"
          class="wbb"
          style="display:inline-block;text-align:left!important">

        <!-- Hidden ID field -->
        <input type="hidden" th:field="*{matchId}" />

        <p>
            <label>Player Name:</label>
            <input type="text" th:field="*{playerName}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('playerName')}" th:errors="*{playerName}"></p>

        <p>
            <label>Agent:</label>
            <input type="text" th:field="*{agent}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('agent')}" th:errors="*{agent}"></p>

        <p>
            <label>Map:</label>
            <input type="text" th:field="*{mapName}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('mapName')}" th:errors="*{mapName}"></p>

        <p>
            <label>Kills:</label>
            <input type="number" th:field="*{kills}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('kills')}" th:errors="*{kills}"></p>

        <p>
            <label>Deaths:</label>
            <input type="number" th:field="*{deaths}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('deaths')}" th:errors="*{deaths}"></p>

        <p>
            <label>Assists:</label>
            <input type="number" th:field="*{assists}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('assists')}" th:errors="*{assists}"></p>

        <p>
            <label>Damage Dealt:</label>
            <input type="number" th:field="*{damage}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('damage')}" th:errors="*{damage}"></p>

        <p>
            <label>Rounds Played:</label>
            <input type="number" th:field="*{rounds}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('rounds')}" th:errors="*{rounds}"></p>

        <p>
            <label>KAST Rounds:</label>
            <input type="number" th:field="*{kastRounds}" />
        </p>
        <p class="cd" th:if="${#fields.hasErrors('kastRounds')}" th:errors="*{kastRounds}"></p>

        <!-- Show any business validation issues -->
        <ul th:each="businessValidationError : ${businessValidationErrorsKastRounds}">
            <li class="cd" th:text="${businessValidationError}"></li>
        </ul>

        <!-- Submit button -->
        <button style="display:block;margin-top:24px!important"
                class="centered"
                th:text="#{label.submit}">Submit</button>
    </form>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
