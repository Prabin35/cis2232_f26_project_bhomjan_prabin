<!DOCTYPE html>

<!--Thanks to Ferhad, Francisco, and Carter from grad 2022 for the styling on this page.-->

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
    <title id="pageTitle" th:text="${session.title}">Topic List</title>
</head>
<body>
<nav th:replace="fragments/navHeader :: navbar"></nav>
<div class="container my-4">
    <h2 class="mb-3 text-center title">Valorant Match List</h2>
    <h2 class="mb-3 text-center error" th:if="${not #strings.isEmpty(messageError)}" th:text="${messageError}" >Message from controller</h2>
    <h2 class="mb-3 text-center success" th:if="${not #strings.isEmpty(messageSuccess)}" th:text="${messageSuccess}" >Message success from controller</h2>

    <!--    Search by player name-->
    <form th:object="${match}" action="replacedBeforePageRendered" th:action="@{/valorantmatch/search}"  method="post">
        <label for="name" th:text="#{label.search.name}">Name</label>
        <input type="text" id="name" th:field="${match.playerName}"/>
        <button type="submit">Search</button>
    </form>

    <div class="table-responsive">
        <table id="theData" class="table table-striped table-hover align-middle">
            <thead class="table-dark text-center">
            <tr>
                <th>ID</th>
                <th>Player Name</th>
                <th>Agent</th>
                <th>Map</th>
                <th>Kills</th>
                <th>Deaths</th>
                <th>Assists</th>
                <th>Damage Dealt</th>
                <th>Rounds Played</th>
                <th>KAST Rounds</th>
                <th>KDA Ratio</th>
                <th>ACS</th>
                <th>KAST %</th>
                <th>Options</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="current : ${matches}">
                <td th:text="${current.matchId}"></td>
                <td th:text="${current.playerName}"></td>
                <td th:text="${current.agent}"></td>
                <td th:text="${current.mapName}"></td>
                <td th:text="${current.kills}"></td>
                <td th:text="${current.deaths}"></td>
                <td th:text="${current.assists}"></td>
                <td th:text="${current.damage}"></td>
                <td th:text="${current.rounds}"></td>
                <td th:text="${current.kastRounds}"></td>
                <td th:text="${#numbers.formatDecimal(T(ca.hccis.valorant.bo.ValorantMatchBO).calculateKdaRatio(current), 1, 2)}"></td>
                <td th:text="${#numbers.formatDecimal(T(ca.hccis.valorant.bo.ValorantMatchBO).calculateAcs(current), 1, 2)}"></td>
                <td th:text="${#numbers.formatDecimal(T(ca.hccis.valorant.bo.ValorantMatchBO).calculateKastPercentage(current), 1, 2)} + '%'"></td>

                <td class="text-center">
                    <div class="btn-group" role="group">
                        <a th:href="@{/valorantmatch/edit/{id}(id=${current.matchId})}"
                           class="btn btn-sm btn-outline-primary" title="Edit">
                            <i class="accent fas fa-edit"></i>
                        </a>
                        <a th:href="@{/valorantmatch/delete/{id}(id=${current.matchId})}"
                           class="btn btn-sm btn-outline-danger" title="Delete">
                            <i class="accent fas fa-trash"></i>
                        </a>
                    </div>
                </td>
            </tr>

            <!-- Message when no data -->
            <tr th:if="${#lists.isEmpty(matches)}">
                <td colspan="14" class="text-center text-muted py-4">
                    No matches found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Optional "Add new" button -->
    <div class="text-center mt-3">
        <a th:href="@{/valorantmatch/add}" href="/valorantmatch/add" class="accent accent-background btn btn-success">
            <i class="fas fa-plus"></i> Add New Match
        </a>
    </div>
</div>
<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
